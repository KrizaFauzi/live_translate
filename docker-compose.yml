version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8008:8000"
    volumes:
      - ./backend:/app
      - model_cache:/root/.cache/huggingface
  frontend:
    image: node:lts-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3005:3005"
    command: sh -c "npm install && npm run dev -- --host --port 3005"
volumes:
  model_cache: