services:
  backend:
    build:
      context: ./backend
    ports:
      - "8008:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      libretranslate:
        condition: service_healthy
      whispercpp:
        condition: service_healthy
  whispercpp:
    image: ghcr.io/ggml-org/whisper.cpp:main
    # The image's entrypoint is already `bash -c`, so pass the whole shell
    # script as its single argument. A list such as `sh -c <script>` makes
    # Bash execute only `sh` (or `test`) and exit before starting the server.
    command:
      - >-
        test -f /models/ggml-base.bin || ./models/download-ggml-model.sh base /models;
        exec whisper-server --host 0.0.0.0 -m /models/ggml-base.bin
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m
    volumes:
      - whispercpp_models:/models
  libretranslate:
    image: libretranslate/libretranslate:latest
    command: --load-only en,id --threads 2
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5m
    volumes:
      - libretranslate_models:/home/libretranslate/.local
  frontend:
    image: node:lts-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3005:3005"
    command: sh -c "npm ci && npm run dev -- --host --port 3005"
volumes:
  frontend_node_modules:
  libretranslate_models:
  whispercpp_models:
