services:
  backend:
    build:
      context: ./backend
    ports:
      - "8008:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - libretranslate
      - whispercpp
  whispercpp:
    image: ghcr.io/ggml-org/whisper.cpp:main
    command: sh -c 'test -f /models/ggml-base.bin || ./models/download-ggml-model.sh base /models; whisper-server --host 0.0.0.0 -m /models/ggml-base.bin'
    volumes:
      - whispercpp_models:/models
  libretranslate:
    image: libretranslate/libretranslate:latest
    command: --load-only en,id --threads 2
    volumes:
      - libretranslate_models:/home/libretranslate/.local
  frontend:
    image: node:lts-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3005:3005"
    command: sh -c "npm ci && npm run dev -- --host --port 3005"
volumes:
  frontend_node_modules:
  libretranslate_models:
  whispercpp_models:
