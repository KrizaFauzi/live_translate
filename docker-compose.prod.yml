version: '3.8'

services:
  backend:
    build:
      context: ./backend
      args:
        - HF_TOKEN=${HF_TOKEN}
    ports:
      - "8008:8000"
    volumes:
      - model_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  model_cache: